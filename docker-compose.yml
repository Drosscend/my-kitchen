# Deployed by Dokploy. No `ports:` (Traefik routes through dokploy-network,
# published ports bypass UFW) and no Traefik labels (Dokploy generates them
# from the Domains tab).

services:
  app:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "process.exit((await fetch('http://127.0.0.1:3000/api/health')).ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  dokploy-network:
    external: true
  internal:
